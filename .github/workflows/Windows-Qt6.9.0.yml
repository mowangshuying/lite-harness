# 结构参考 3rdparty/FluentUI/.github/workflows/Windows-Qt6.9.0.yml（蓝本），按本仓实际裁剪：
# - CI 验收 = 干净环境全量 configure + Release build + ctest 单测 + CPack 出包成功
#   （单测只覆盖纯函数，见 tests/；测试失败即中止，不让坏产物进 zip）

# - Windows-only / MSVC 2022 x64 / Qt 6.9.0 单点，不铺版本矩阵
# - tag（v*/s*）推送时末尾步骤把 zip 上传为该 tag 的 GitHub Release（蓝本 New Release 同款分流）
name: Windows-Qt6.9.0
on:
  push:
    # branches 必须与 tags 显式同写：官方语义「只定义 tags 时，未定义的 ref 类型不触发」，
    # 漏写 branches 会静默丢掉分支验收流。paths 过滤只拦分支推送——官方原文
    # "Path filters are not evaluated for pushes of tags"，tag 流不受下方清单拦截。
    branches: ['main']
    tags: ['v*', 's*']
    paths:
      - 'CMakeLists.txt'
      - 'LiteHarness.rc'
      - 'cmake/**'
      - 'src/**'
      - 'stylesheet/**'
      - 'res/**'
      - 'i18n/**'
      - 'tests/**'
      - '3rdparty/**'
      - '.github/workflows/Windows-Qt6.9.0.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'LiteHarness.rc'
      - 'cmake/**'
      - 'src/**'
      - 'stylesheet/**'
      - 'res/**'
      - 'i18n/**'
      - 'tests/**'
      - '3rdparty/**'
      - '.github/workflows/Windows-Qt6.9.0.yml'
jobs:

  build:
    name: Build
    # upload-release-action 上传 Release 资产所需；显式声明防仓库级设置收紧后静默 403
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022]
        include:
          - qt_ver: 6.9.0
            qt_arch: win64_msvc2022_64
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # 仅 init FluentUI 单路径、不用 submodules: recursive（与蓝本差异的取舍）：
      # .gitmodules 里的 3rdparty/lcc 仅为移植规格参考、从不进构建图，recursive 会白白
      # 拉取无关大仓；FluentUI 自身无嵌套子模块（其目录内无 .gitmodules，已核实），
      # 非递归安全。--depth 1 只取钉住的 commit，加速检出。
      - name: Init FluentUI submodule
        run: git submodule update --init --depth 1 3rdparty/FluentUI

      # 与蓝本同款 jurplel/install-qt-action@v4。modules 需求为 configure 取证的闭包：
      # Widgets/Svg/Network/PrintSupport/Concurrent/GuiPrivate/LinguistTools 随 desktop
      # 基础安装提供（蓝本 REQUIRED Svg 亦未列 qtsvg，即证默认含）；唯二额外 addon 是
      # FluentUI 根 CMakeLists REQUIRED 的 Charts（qtcharts）与 Core5Compat（qt5compat）。
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          arch: ${{ matrix.qt_arch }}
          cache: true
          modules: 'qt5compat qtcharts'

      # 蓝本硬编码 D:\a\FluentUI\Qt\<ver>\<arch> 前缀路径；本仓改经 qmake -query 定位
      # （install-qt-action 会把 Qt bin 加入 PATH），不依赖 runner 盘符/目录布局，并以
      # lrelease 存在性做前置断言（qt_add_translations 构建期必需）。
      # 必须全量构建（不加 --target lite-harness）：install 规则在 configure 期注册进全树
      # 安装清单，FluentUI 子项目（gallery.exe/cmark.exe 等）的规则也在其中；CPack 逐条
      # file(INSTALL) 时缺文件=硬错误中止，根级清理 install(CODE) 依赖「子先父后」执行序
      # 根本没轮到。s12.2 两条 run 实证挂此坑（CPack Error: cannot find gallery.exe/cmark.exe）。
      - name: Msvc configure & build (Release, all targets)
        shell: pwsh
        run: |
          $prefix = (qmake -query QT_INSTALL_PREFIX).Trim()
          if (-not $prefix) { throw 'qmake -query QT_INSTALL_PREFIX returned empty' }
          if (-not (Test-Path (Join-Path $prefix 'bin\lrelease.exe'))) { throw "lrelease not found under $prefix (LinguistTools missing?)" }
          Write-Output "Qt prefix: $prefix (version $((qmake -query QT_VERSION).Trim()))"
          cmake -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$prefix"
          cmake --build build --config Release --parallel
          Get-Item build\bin\lite-harness.exe

      # 单元测试（ctest）：跑在 Release 构建之后、打包之前——测试失败即中止流程，
      # 不让坏产物进 zip。测试 exe 输出在 build/tests/（与 bin/ 分开，不进 CPack staging）；
      # Qt6Core.dll 由 install-qt-action 注入的 PATH 提供，无需额外部署。
      #
      # LITE_TEST_TMPROOT 必须在此注入，且路径尾缀必须是 tmp-test（tests/ScopedTempRoot.h
      # 的构造/析构双守卫之一）。缺它时 4/5 套件整组走 SKIP 通道——SKIP 既不计失败也不产生
      # 断言，进程返回 0，ctest 判通过：s13 起本步一直是这种假绿，实际只守了 LineEnding.h。
      # LITE_TEST_MIN_PASS 是断言下界门禁（tests/main.cpp），把「跑到了多少断言」变成硬条件；
      # 量级 = 五套件全实跑的 pass 计数下浮值，新增套件时同步上调。
      - name: Unit tests (ctest)
        shell: pwsh
        run: |
          $env:LITE_TEST_TMPROOT = Join-Path $env:RUNNER_TEMP 'tmp-test'
          $env:LITE_TEST_MIN_PASS = '500'
          Write-Output "LITE_TEST_TMPROOT=$env:LITE_TEST_TMPROOT"
          ctest --test-dir build -C Release --output-on-failure

      # CPack ZIP（AGENTS.md「打包」节实证链）：--config 必带否则报 generator not specified；
      # cpack 不触发编译，staging 取上一步 Release 产物 build/bin/lite-harness.exe。
      - name: Package (CPack ZIP)
        shell: pwsh
        run: |
          cpack --config build/CPackConfig.cmake -B build
          Get-Item build\lite-harness-*-win64.zip

      # Release 标题与简介的单源 = **附注 tag 的正文**（发版必须 `git tag -a`）。
      # 此前本步不传 release_name/body，自动创建的 Release 天生裸奔——s12.5/s12.6 的 name 为
      # null、正文为空，s12.2/s12.3 的简介是当年人工在网页补的，四种来源方式必然不一致。
      # 故把 tag 附注喂进 body、标题统一成 `lite-harness <tag>`，让每个 tag 天然带规范格式。
      - name: Read tag annotation as release notes
        id: notes
        if: startsWith(github.event.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # checkout 默认浅克隆不保证带 tag 对象，显式取回该 tag ref 再读附注
          git fetch --no-tags --depth=1 origin "+refs/tags/${tag}:refs/tags/${tag}"
          $body = (git for-each-ref --format='%(contents)' "refs/tags/${tag}") -join "`n"
          if ([string]::IsNullOrWhiteSpace($body)) {
            throw "tag ${tag} 无附注正文：发版必须用 git tag -a（附注即 Release 简介的单源），轻量 tag 会产出空简介的 Release。"
          }
          "body<<LITE_NOTES_EOF" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "LITE_NOTES_EOF" >> $env:GITHUB_OUTPUT
          Write-Output "Release 简介取自 tag ${tag} 附注（$($body.Length) 字）"

      # 蓝本同款 tag 分流：分支/PR 推送跑到上一步即验收完成；tag 推送把 zip 传为该 tag 的
      # Release（svenstaro 动作对不存在的 Release 自动创建）。file_glob 开启时资产名取
      # zip basename（含版本号），免在 yml 硬编码版本、守住「版本号单源」。
      - name: New Release
        if: startsWith(github.event.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./build/lite-harness-*-win64.zip
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          release_name: lite-harness ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}

