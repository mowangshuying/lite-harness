# 结构参考 3rdparty/FluentUI/.github/workflows/Windows-Qt6.9.0.yml（蓝本），按本仓实际裁剪：
# - CI 验收 = 干净环境全量 configure + Release build + ctest 单测 + CPack 出包成功
#   （单测只覆盖纯函数，见 tests/；测试失败即中止，不让坏产物进 zip）

# - Windows-only / MSVC 2022 x64 / Qt 6.9.0 单点，不铺版本矩阵
# - tag（v*/s*）推送时末尾步骤把 zip 上传为该 tag 的 GitHub Release（蓝本 New Release 同款分流）
name: Windows-Qt6.9.0
on:
  push:
    # branches 必须与 tags 显式同写：官方语义「只定义 tags 时，未定义的 ref 类型不触发」，
    # 漏写 branches 会静默丢掉分支验收流。paths 过滤只拦分支推送——官方原文
    # "Path filters are not evaluated for pushes of tags"，tag 流不受下方清单拦截。
    branches: ['main']
    tags: ['v*', 's*']
    paths:
      - 'CMakeLists.txt'
      - 'LiteHarness.rc'
      # AGENTS.md 与 docs/ 入清单是 s18.7 文档分层批的必需项：tst_agentsize 读这两处判「注入
      # 窗口锚点在窗 + 体量棘轮 + 台账不双写」，不列则「只改文档」的那一轮根本不触发验收流，
      # 闸门对最可能把它撑爆的那类改动（往 AGENTS.md 追加一批复测登记）恰好失效。
      - 'AGENTS.md'
      - 'docs/**'
      - 'cmake/**'
      - 'src/**'
      - 'stylesheet/**'
      - 'res/**'
      - 'i18n/**'
      - 'tests/**'
      - '3rdparty/**'
      - '.github/workflows/Windows-Qt6.9.0.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'LiteHarness.rc'
      - 'AGENTS.md'
      - 'docs/**'
      - 'cmake/**'
      - 'src/**'
      - 'stylesheet/**'
      - 'res/**'
      - 'i18n/**'
      - 'tests/**'
      - '3rdparty/**'
      - '.github/workflows/Windows-Qt6.9.0.yml'
jobs:

  build:
    name: Build
    # upload-release-action 上传 Release 资产所需；显式声明防仓库级设置收紧后静默 403
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022]
        include:
          - qt_ver: 6.9.0
            qt_arch: win64_msvc2022_64
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # 仅 init FluentUI 单路径、不用 submodules: recursive（与蓝本差异的取舍）：
      # .gitmodules 里的 3rdparty/lcc 仅为移植规格参考、从不进构建图，recursive 会白白
      # 拉取无关大仓；FluentUI 自身无嵌套子模块（其目录内无 .gitmodules，已核实），
      # 非递归安全。--depth 1 只取钉住的 commit，加速检出。
      - name: Init FluentUI submodule
        run: git submodule update --init --depth 1 3rdparty/FluentUI

      # 与蓝本同款 jurplel/install-qt-action@v4。modules 需求为 configure 取证的闭包：
      # Widgets/Svg/Network/PrintSupport/Concurrent/GuiPrivate/LinguistTools 随 desktop
      # 基础安装提供（蓝本 REQUIRED Svg 亦未列 qtsvg，即证默认含）；唯二额外 addon 是
      # FluentUI 根 CMakeLists REQUIRED 的 Charts（qtcharts）与 Core5Compat（qt5compat）。
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          arch: ${{ matrix.qt_arch }}
          cache: true
          modules: 'qt5compat qtcharts'

      # 蓝本硬编码 D:\a\FluentUI\Qt\<ver>\<arch> 前缀路径；本仓改经 qmake -query 定位
      # （install-qt-action 会把 Qt bin 加入 PATH），不依赖 runner 盘符/目录布局，并以
      # lrelease 存在性做前置断言（qt_add_translations 构建期必需）。
      # 必须全量构建（不加 --target lite-harness）：install 规则在 configure 期注册进全树
      # 安装清单，FluentUI 子项目（gallery.exe/cmark.exe 等）的规则也在其中；CPack 逐条
      # file(INSTALL) 时缺文件=硬错误中止，根级清理 install(CODE) 依赖「子先父后」执行序
      # 根本没轮到。s12.2 两条 run 实证挂此坑（CPack Error: cannot find gallery.exe/cmark.exe）。
      - name: Msvc configure & build (Release, all targets)
        shell: pwsh
        run: |
          $prefix = (qmake -query QT_INSTALL_PREFIX).Trim()
          if (-not $prefix) { throw 'qmake -query QT_INSTALL_PREFIX returned empty' }
          if (-not (Test-Path (Join-Path $prefix 'bin\lrelease.exe'))) { throw "lrelease not found under $prefix (LinguistTools missing?)" }
          Write-Output "Qt prefix: $prefix (version $((qmake -query QT_VERSION).Trim()))"
          cmake -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$prefix"
          cmake --build build --config Release --parallel
          Get-Item build\bin\lite-harness.exe

      # 单元测试（ctest）：跑在 Release 构建之后、打包之前——测试失败即中止流程，
      # 不让坏产物进 zip。测试 exe 输出在 build/tests/（与 bin/ 分开，不进 CPack staging）；
      # Qt6Core.dll 由 install-qt-action 注入的 PATH 提供，无需额外部署。
      #
      # LITE_TEST_TMPROOT 必须在此注入，且路径尾缀必须是 tmp-test（tests/ScopedTempRoot.h
        # 的构造/析构双守卫之一）。缺它时 4/10 套件整组走 SKIP 通道（s15 两套件与 s16 两套件
        # 均为纯函数组恒跑、夹具组局部 skip，不整组跳过）——SKIP 既不计失败也不产生
       # 断言，进程返回 0，ctest 判通过：s13 起本步一直是这种假绿，实际只守了 LineEnding.h。
       # LITE_TEST_MIN_PASS 是断言下界门禁（tests/main.cpp），把「跑到了多少断言」变成硬条件；
        # 量级 = 套件全实跑的 pass 计数下浮值，新增套件时同步上调。
        # s16 口径：s15 全量实测 730，新增 tst_workflowmanager(155) + tst_workflowruntime(约 87)
        # = 全量实测 972；再新增 tst_compacttokens(实跑 48) = 1020；本轮新增 tst_settingscache(实跑 75)
        # = 全量实测 1095；取下界 990 ≈ 留约 10% 余量（吸收个别断言随 Qt 小版本微调的影响）。
        # 用量计量口径：新增 tst_usagetokens(本机实跑 49 断言全绿，UsageTokens.h 纯头，零夹具恒跑)。
        # 下界同幅上调 990→1039，维持原约 10% 余量口径（上调的是同一道余量的平移，不是重新估量级）。
        # 输出速度口径：新增 tst_streamrate（本机实跑 26 断言全绿，StreamRate.h 纯头，零夹具恒跑）。
        # 十四套件本机全量实跑 1188（静态断言点 1127 + 文件门禁组的动态计数；含 1 条 junction 夹具
        # skip——CI 上夹具可用时更高，故 1188 是下浮基准、不是 CI 实测）；下界 1066 即在此基准上留
        # 约 10% 余量。此前登记的 1144（= 上一轮 CI 实测 1095 + 本套件 49）是推算链，已被 1188 实测
        # 取代、勿当实测引用。
        # s17 goal 口径：新增 tst_goalmanager（本机实跑 209 断言全绿 = 静态点 195 + CLEAR_ALIASES
        # 循环展开；GoalRules.h 纯头 + GoalManager 引擎判据，零夹具恒跑）；十五套件 P2r 修复批后
        # 本机全量实跑 1397（含 1 条 junction 夹具 skip，同为下浮基准）。下界 1066→1250 按本轮
        # 实跑 1397 留约 10% 余量上调（1397×0.9≈1257，取整 1250）。若 CI 首跑 pass 数明显低于
        # 1397，按实测回落本行与下方阈值。
        # FluentUI 配置落点改造口径：新增 tst_fluconfigstore（本机实跑 75 条 = 恒跑组 18 + 夹具门控组
        # 57，FluConfigStore.h 纯 QtCore 定位层：三段解析/格式折叠/落点拼接不越界/JSON 后端往返与坏文件
        # 拒用）与 tst_fluconfigutils（本机实跑 49 条 = 恒跑组 4 + 夹具门控组 45，FluConfigUtils 门面侧：
        # 缺省三段逐字复现改造前硬编码落点 / configure 注入后 JSON 落点与嵌套形态 / 同值注入不重建 /
        # 换定位不迁移旧值 / 扩展名由 format 强制 / 既有 API 在新后端照常往返）；十八套件本机全量实跑
        # 1612（含 1 条 junction 夹具 skip，同为下浮基准）。下界 1250→1400 按实跑 1565 留约 10% 余量
        # 上调（1565×0.9≈1408，取整 1400），fluconfigutils 套件补入后实跑 1612、下界仍留 1400
        # （1612×0.9≈1451，但两套件共 102/124 条挂在 LITE_TEST_TMPROOT 夹具门上，缺该变量只残 22 条，
        # 逼到满量附近即成赌环境波动）——本步已注入该变量。
        # 存储锚点统一口径：新增 tst_litepaths（本机实跑 29 条，LitePaths.h 纯字符串派生、零 IO 零夹具
        # 恒跑：存储根反推与三种写法归一 / .lite-harness 中间层只出现一次 / 空 dataId 回退形态 /
        # 删除护栏的严格包含前提）与 tst_pathguard（本机实跑 21 条，AgentPathGuard.h::isWithinSandboxRoots
        # 多根围栏：分隔符边界 / 兄弟会话不可互达 / 大小写不敏感 / 空根集合与空根串 fail-closed /
        # 根入参 cleanPath 归一，同为零夹具恒跑）；二十套件本机全量实跑 1662（含 1 条 junction 夹具
        # skip，同为下浮基准；与 AGENTS.md 登记值逐条对账：1612 + 29 + 21 = 1662）。下界 1400→1450：
        # 本批 50 条**全部挂在恒跑组上、不依赖 LITE_TEST_TMPROOT**，故按同幅度等量上移（1662×0.9≈1496，
        # 仍留 1450 而非 1496，沿用上一条「不逼到满量附近」的取舍）。
        # 会话索引并入 config.json 口径：新增 tst_sessionstore（本机实跑 101 条 = 恒跑组 4 + 夹具门控组 97，
        # 键名口径 / 读写换轨 / 盘上数组形态 / 整表回写不抹别人键 / 空表仍是数组 / 坏形态降级 / 旧 index.json
        # 迁移四分支）；本批另把 tst_fluconfigutils 一条**不成立的断言**（`getSettings() != before` 判「已重建」，
        # 而 delete 后 new 同尺寸对象复用地址是合法行为，实测约 1/10 跑假红）换成与分配器无关的「绑定文件换了」。
        # 二十二套件本机全量实跑 1798（含 1 条 junction 夹具 skip，同为下浮基准；与 AGENTS.md 登记值逐条对账：
        # 1697 + 101 = 1798）。下界 1450→1600：本批 101 条里 97 条挂在 LITE_TEST_TMPROOT 夹具门上，
        # 但 CI 本步已注入该变量，故按 1798×0.9≈1618 取整 1600（仍留「不逼到满量附近」的余量）。
        # s17.6 UI 优化批：新增 6 个零夹具套件 98 条断言（tst_uiux 16 + P2 五件 82：tooltagkind 26 /
        # layoutconst 23 / navkeys 14 / agentconst 12 / toolnames 7）。此处曾登记 78：只数了 P2 五件、
        # 漏了 tst_uiux（b3c8c05 新建 16 条），且 P2 取数用行首正则漏掉行中位置的 check(，故又少 4 条。
        # 更正值取自逐套件插桩实跑（夹具根须为仓库内 build\tmp-test，本机安全策略拦截仓库外写入）：
        # 六套件实跑 98 与其静态 check( 点数逐条相等（循环只累加标志位，断言均在循环外）。
        # 下界 1600→1680 当时按 78 估，偏保守但安全——本批实增 98，下界仍低于满量。
        # 压缩转写回放：新增 tst_compacttranscript（本机实跑 40 条全绿，CompactTranscript.h 纯头，
        # 零夹具恒跑）。本机全量实跑 1903 + 40 = 1943，下界 1680→1720（1943×0.9≈1749，取整仍留余量）。
        # 逐套拆分现值（本轮插桩实跑，带夹具 1943 / 不带夹具 988）：tst_settingscache 89 = 恒跑 35 + 夹具门控 54、
        # tst_fluconfigstore 75 = 49 + 26、tst_fluconfigutils 47 = 4 + 43、tst_uiscale 68（零夹具）；上文历史批次条目按「不改历史只登记」保留原值。
        # 会话活动热力图（s17.8 未定版本号）：新增 tst_activityledger（本机实跑 58 条 = 恒跑组 42 +
        # 夹具门控组 16，ActivityLedger.h 纯头：五档阈值边界 / 日期键严格 ISO 往返（斜杠写法必须拒）/
        # accumulateSnapshot 无效快照丢弃 / totalProcessed / aggregate 跨会话合并 / windowFilter 闭区间 /
        # 文件读写往返 / 脏 JSON 降级到空表）；本机全量实跑 2001（含 1 条 junction 夹具 skip，同为下浮基准；
        # 与上一批登记值 1943 + 58 = 2001 逐条对账）。下界 1720→1800（2001×0.9≈1801，取整仍留余量——
        # 58 条里 16 条挂在 LITE_TEST_TMPROOT 夹具门上，缺该变量残 42 条，故不逼到满量附近）。
        # token 紧凑读数口径：tst_usagetokens 49→82（UsageTokens.h 新增 formatCompact 单源：999/1000 档位入口、
        # 999949→999.9K 与 999950→1M 的进位升档、1e6 折 M、整十位省 .0、负号透传、LLONG_MIN 不 UB、现实量级内
        # 读数不超 8 字符）；33 条全部挂在恒跑组、不依赖 LITE_TEST_TMPROOT，故下界 1800→1830 按本机实跑 2034
        # ×0.9≈1830 等量上移（同批顺带修 84b69c8 引入的注释缺 # 前缀——157/158 两行被 pwsh 当命令、YAML 亦不可解析）。
        # s17.9 上下文预算恒等批：tst_agentconst 12→16（新增四条 contextTokenBudgetFrom identity 断言，
        # 钉死「预算 = 声明值本身、不再 ÷4」，改回任何系数即编译失败 + 测试转红）；4 条全挂恒跑组、
        # 不依赖 LITE_TEST_TMPROOT，故下界 1830→1834 按本机实跑 2038×0.9≈1834 等量上移。
        # s17.9 工具判据抽头批：tst_agentrecovery 24→34（新增 10 条 RecoveryRules::isToolFailureText
        # 断言，把「asyncApprovalDenied() 定值串必须判失败」从注释约定升级成断言）；10 条全挂恒跑组，
        # 故下界 1834→1843 按本机实跑 2048×0.9≈1843 等量上移。
        # 同批另加「逐套件下界表」（tests/main.cpp kSuiteFloors）：全局下界挡不住「单个套件静默消失」
        # ——31 套件里 30 个的条数都小于全局余量，删掉任意一行 runSuite 调用 CI 仍全绿；现表内每个名字
        # 都必须被跑到且不低于自身下界，漏跑/改名/删断言组一律硬失败。
        # s17.9 热力图算术抽头批：新增纯头 HeatmapGrid.h + 套件 tst_heatmapgrid（27 条，零夹具恒跑），
        # 把「371 满矩形 / 末格恒为 today / cellOf↔dateOfCell 互逆」从只能肉眼看的 QWidget 里抽出来直测
        # ——这正是 s17.9 初版那个「尾列留空破矩形」故障的不变量；ContributionHeatmap 三处改转调、不留
        # 第二份算术。同批加门禁③ LITE_TEST_MAX_SKIP=1（CI 侧 skip 上界，本机不设不判）：全测试目标有
        # 42 处 skip 通道，此前「夹具被改坏」是绿着降级。下界 1843→1867 按实跑 2075×0.9≈1867 上调。
        # s17.9 记忆判据抽头批：新增纯头 MemoryRules.h + 套件 tst_memoryrules（76 条，零夹具恒跑），把
        # frontmatter 回落/slug 撞名/括号配对状态机/三重去重/写读往返，从「链 Qt6::Network 因而进不了
        # ctest 的 MemoryManager.cpp」里抽出来直测——这批判据此前整族零覆盖，错了不报错，只让记忆静默
        # 变少（整批丢条目）或变脏（撞名覆盖）。同批实测登记一条偏差：源码注释原称非法 JSON 转义
        # 「≈ PyYAML 报错回落」，Qt 实际宽容接受 [\"a\\q\"] 并静默吞掉反斜杠得到 aq（不回落），
        # 注释与断言均已按实测改正。下界 1867→1935 按本机实跑 2151×0.9≈1935 等量上调。
        # s17.9 工具 schema 抽头批：新增纯头 ToolSchema.h + 套件 tst_toolschema（55 条，零夹具恒跑），把
        # 27 个工具的 schema 一致性从「AgentLoopPrompt.cpp 经 AgentLoop.h 传递 include QOpenAi.h、因而
        # 进不了 ctest」里抽出来直测——required 多写一个键就是会话第一个请求 400、name 与 ToolNames 漂移
        # 就是工具恒 no-op，而本地编译与既有测试全绿。同批把 AgentLoop::createToolsDefinition() 退化为
        # 一行转发（纯头绝不 include AgentLoop.h，否则拖进 moc + Qt6::Network）。下界 1935→1985 按本机
        # 实跑 2206×0.9≈1985 等量上调。
        # s17.9 会话键算术抽头批：新增纯头 SessionKeys.h + 套件 tst_sessionkeys（45 条，零夹具恒跑），把
        # 两族会话键的拼装/归属/撞车条件从「SessionRegistry.cpp 硬绑 Qt6::Widgets + FluentUI 因而进不了
        # ctest」里抽出来直测——键撞车后果不可逆：insert 用 QHash::operator[] 就地覆盖，删兄弟会话时会连带
        # 把另一会话的 sessions/<dataId> 整目录递归抹掉。同批**证伪一条注释不变量**：原写「hex 永不等于
        # 十进制自增」的理由不成立（数字串是 hex 子集），真正兜住的是长度屏障（seq 到 10^7 前不足 8 位），
        # 短 dataId 可直接撞车而 createSession 侧无 contains 卫兵；本批只算键不改行为，加不加卫兵待裁决。
        # 下界 1985→2025 按本机实跑 2251×0.9≈2025 等量上调。
        # s17.11 项目指令文件批：新增纯头 ProjectInstructions.h + TU AgentLoopInstructions.cpp + 套件
        # tst_projectinstructions（49 条，零夹具恒跑），把「AGENTS.md 两级回退（工程根 → 存储根，命中
        # 即止）+ 空段省略 + 字符预算截断如实标注 + 路径/mtime/size 签名」从「AgentLoopInstructions.cpp
        # 链 AgentLoop.h→QOpenAi.h→Qt6::Network 因而进不了 ctest」里抽出来直测——候选顺序写反会让全局那份
        # 静默压住项目根的规则且零报错，截断静默吞尾会让模型宣称「已遵循项目全部约定」。同批修掉纯头里
        # 一处链式 arg() 缺陷（两个整数命中 arg(qlonglong, int fieldWidth) 重载，第二个数被当字段宽度，
        # 段标题产出错串且静默），改走全 '+' 拼接并补两条截断分支的 '%' 不展开断言。
        # 下界 2025→2070 按本机实跑 2300×0.9≈2070 等量上调。
        # s17.12 自更新判据批：新增纯头 UpdateRules.h + TU UpdateManager.{h,cpp} + 套件
        # tst_updaterules（137 条，零夹具恒跑），把「版本数值比较（字典序在补丁位上恰好反向）/
        # 资产择优只认 win64 / digest 缺失即拒（fail-closed，缺校验和绝不换体）/ zip 条目映射白名单
        # （挡 zip-slip 与数据根覆盖，config/ log/ 进不来）/ 包内根推导而非写死 / 换体计划一条不落白名单
        # 即整批作废 / marker 一条不可删即整体 invalid / 残留清理的版本闸门（备份是旧版唯一副本）/
        # 开发态布局闸门」从「UpdateManager.cpp 链 Qt6::Network 因而进不了 ctest」里抽出来直测。
        # 下界 2070→2193 按本机实跑 2437×0.9≈2193 等量上调。
        # s17.12 进度环分母判据批：`UpdateRules::progressPercentOrUnknown` + 18 条断言（套件 137→155）。
        # 这条判据错时不抛异常、不报失败，只把一个还在下的包显示成「已下完」——`assetSizeOrUnknown`
        # 刻意把未知留成 -1 而不是 0，全是为了这里不渲染出一个恒 100% 的假进度；同时钉住
        # `received > total` 钳到 100（137% 画在环上是几何无意义的弧）与 INT64_MAX 走钳位分支
        # 而非 `received * 100` 溢出（这条是补测时才发现的真缺陷：原两条 INT64_MAX 断言都恰好
        # 走了钳位分支，碰不到 `received < total` 且 received 超 INT64_MAX/100 的有符号溢出）。
        # 下界 2193→2209 按本机实跑 2455×0.9≈2209 等量上调。
        # s17.13.1 三段版本判据批：`UpdateRules::parseVersion` 放宽到「主.补丁」两段**或**
        # 「主.补丁.修订」三段（出参个数即调用方声明的形态宽度：只给两指出参时遇三段仍拒，
        # 绝不静默截断），`compareVersions`/`shouldCleanResidue`/`parseMarker` 三个消费点同步
        # 接第三段。发三段版前这三条判据会静默废掉自更新通道：三段串解析失败 →
        # `compareVersions` 返回 0 → `isUpdateAvailable` 恒 false，装上三段版的实例从此
        # 永远看不到任何更新（不是报错，是静默「已是最新」）；`shouldCleanResidue` 同理恒
        # false，换体残留与备份永久滞留。marker `schema` 版本**刻意不升**：已发布实例写的
        # 两段 marker 必须还能读，兼容性靠 parseVersion 同时接受两种形态，而非放宽 schema 闸门。
        # 套件 155→174（+19，零夹具恒跑），无夹具全表求和 1479→1498；带夹具基数等量
        # 2455→2474，下界 2209→2226 按 2474×0.9≈2226 等量上调。
        # s18 批：parseVersion 再放宽认一段（缺的补丁/修订段按 0 计；阶段 tag s13–s17 本就
        # 单段但那时自更新模块尚未存在，s18 起模块必须认得自身版本，否则静默失去更新通道）。
        # 出参宽度规则只约束三段（一段没有可截断的尾段，两指出参也接受）。
        # 套件 174→198（+24，零夹具恒跑），无夹具全表求和 1498→1522；带夹具基数等量
        # 2474→2498，下界 2226→2248 按 2498×0.9≈2248 等量上调。
        # 升级路径提醒：s17.13.1 及更早实例的旧判据不认单段远端串，应用内看不到 s18
        # （须手动下载 zip 升级）；s18 起实例之间自更新正常。
        # s18 热力图月份标签去重批：底部月份标签选列判据抽成 HeatmapGrid::monthLabels
        # （含 1 号的列贴标 / 按**月号**去重 / 首列补标让位给同号 1 号锚点）。371 天窗口恒覆盖 ≥13 个
        # 月份实例而月号只有 12 个，重复必然存在（起点月与终点月同号跨年，如 today=11-18
        # 时窗口从去年 11-13 起，两端都是「11月」）——按年+月去重抓不到这种重复，这正是
        # 用户报障的形态；而保留首列补标又会与相邻月标签挤压（月界距首日最近仅 1 列），
        # 让位后所有标签都是 1 号锚点、相邻恒 ≥4 列。tst_heatmapgrid 27→39（+12，零夹具恒跑：
        # 任意 today 恰 12 标签 / 月号互异覆盖 1..12 / 列序递增 / 相邻间距 ≥4 列 /
        # 锚点落在标签列 / 去重不丢首次），
        # 无夹具全表求和 1522→1534；带夹具基数等量 2498→2510，下界 2248→2259 按
        # 2510×0.9=2259 等量上调。
        # s18 子代理上下文压缩批：成组裁剪内核从 TeammateRuntime.cpp 抽成纯头 ContextTrim.h
        # （队友改一行转发、SubAgent 复用），新增套件 tst_contexttrim（48 条，零夹具恒跑：
        # 配对不变量 assistant+tool_calls 连同其后连续 tool 整组删 / keepHead 头部保护 /
        # oldest-first / 孤立 tool 兜底跳过 / 目标比 4/5 与 1/2 / 幂等 / changed 旗标当且仅当删条）。
        # 内核此前困在 QObject+QOpenAi TU 零直测，配对一漂即上游 400；SubAgent 主动+反应式压缩
        # 接线本身仍在不可证区（编译期等价+冒烟）。无夹具全表求和 1534→1582；带夹具基数等量
        # 2510→2558，下界 2259→2302 按 2558×0.9≈2302 等量上调。
      # s18.7 优化批（下界 2302→2832，本轮实测；上面 s18 ContextTrim 批那组
      # 登记原样保留、本块不复用其数字）：新增套件 tst_bashrunner 39 条（零夹具恒跑：
      # dangerWarning 匹配语义与 "Error: " 承重前缀 / 空条目等于全拦 / truncateOutput
      # 判据是 > 非 >= 且兜底走 isEmpty 非 trimmed / finalizeOutput 超时分支先于读缓冲），
      # 并把 src/BashRunner.cpp 加进测试目标 TU 清单——它是 AGENTS「覆盖现状」自 s15 起
      # 就登记「dangerWarning 安全关键却 0 直测」却一直没兑现的那一项，且它只 include
      # QFileInfo/QProcess/QStandardPaths/QTimer，本就符合上方「仅 QtCore-only 引擎进表」的纪律。
      # 另新增套件 tst_agentsize 15 条（AGENTS.md 注入窗口闸门：6 个规则锚点在窗 + 体量棘轮
      # ≤122000 + 台账落点非空且与正文不双写；读仓库根两文件，路径经 CMake 编译期注入
      # LITE_REPO_ROOT，不用 `../..` 反推以免把构建布局变成隐式契约）。
      # 无夹具下界求和 2077→2131（+54，与实跑逐字自洽）、带夹具实跑 3093→3147（+54，
      # 两套件均零夹具恒跑故两形态等量上涨）；套件三口径 45→47。
      # **本批同时补回被六个批次欠账的余量**：2302 是 s18 ContextTrim 批按 2558×0.9 算的，
      # 其后 providerspec/modelprefs/imageattach/messagecontent/pastetext/toolcallacc/
      # scrollsettle/cron 各批加断言都没上调下界，实跑已到 3093 而门禁仍 2302——余量从
      # 自述的约 10% 悄悄涨到 26.5%（允许 791 条断言凭空消失不报警）。现按同一口径
      # 3147×0.9≈2832 上调，余量回到约 10%。AGENTS「断言数口径」节「台账与 CI 注释
      # 后续上调两处同写」的纪律自本批恢复。
      - name: Unit tests (ctest)
        shell: pwsh
        run: |
          $env:LITE_TEST_TMPROOT = Join-Path $env:RUNNER_TEMP 'tmp-test'
          # 2832 = 当轮带夹具实跑 3147×0.9（口径见上块注释）。上一登记 2818 系 tst_agentsize
          # 落地前的中间态（3132×0.9≈2818），fbc1f0d 改了四处说明却漏改本行生效值——
          # 2026-11-27 CI 日志实证本行仍是 2818，本笔补正。
          $env:LITE_TEST_MIN_PASS = '2832'
          $env:LITE_TEST_MAX_SKIP = '1'
          Write-Output "LITE_TEST_TMPROOT=$env:LITE_TEST_TMPROOT"
          ctest --test-dir build -C Release --output-on-failure

      # CPack ZIP（AGENTS.md「打包」节实证链）：--config 必带否则报 generator not specified；
      # cpack 不触发编译，staging 取上一步 Release 产物 build/bin/lite-harness.exe。
      - name: Package (CPack ZIP)
        shell: pwsh
        run: |
          cpack --config build/CPackConfig.cmake -B build
          Get-Item build\lite-harness-*-win64.zip

      # Release 标题与简介的单源 = **附注 tag 的正文**（发版必须 `git tag -a`）。
      # 此前本步不传 release_name/body，自动创建的 Release 天生裸奔——s12.5/s12.6 的 name 为
      # null、正文为空，s12.2/s12.3 的简介是当年人工在网页补的，四种来源方式必然不一致。
      # 故把 tag 附注喂进 body、标题统一成 `lite-harness <tag>`，让每个 tag 天然带规范格式。
      - name: Read tag annotation as release notes
        id: notes
        if: startsWith(github.event.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # checkout 默认浅克隆不保证带 tag 对象，显式取回该 tag ref 再读附注
          git fetch --no-tags --depth=1 origin "+refs/tags/${tag}:refs/tags/${tag}"
          $body = (git for-each-ref --format='%(contents)' "refs/tags/${tag}") -join "`n"
          if ([string]::IsNullOrWhiteSpace($body)) {
            throw "tag ${tag} 无附注正文：发版必须用 git tag -a（附注即 Release 简介的单源），轻量 tag 会产出空简介的 Release。"
          }
          "body<<LITE_NOTES_EOF" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "LITE_NOTES_EOF" >> $env:GITHUB_OUTPUT
          Write-Output "Release 简介取自 tag ${tag} 附注（$($body.Length) 字）"

      # 蓝本同款 tag 分流：分支/PR 推送跑到上一步即验收完成；tag 推送把 zip 传为该 tag 的
      # Release（svenstaro 动作对不存在的 Release 自动创建）。file_glob 开启时资产名取
      # zip basename（含版本号），免在 yml 硬编码版本、守住「版本号单源」。
      - name: New Release
        if: startsWith(github.event.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./build/lite-harness-*-win64.zip
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          release_name: lite-harness ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}

